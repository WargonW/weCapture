[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3" }
tauri-plugin-log = "2"
xcap = "0.9"
image = "0.25"
base64 = "0.22"
arboard = "3.4"
tauri-plugin-global-shortcut = "2"
tauri-plugin-store = "2"
openh264 = { version = "0.7", default-features = false, features = ["source"] }
muxide = "0.2"
gif = "0.14"
opus = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
cpal = { version = "0.17", optional = true }

[features]
default = []
# 启用系统音频采集（PulseAudio/ALSA monitor source）。
# 默认关闭以保持构建链轻量；真实环境用 --features audio 启用。
audio = ["dep:cpal"]
